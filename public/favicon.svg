<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Shiba inu">
  <!-- Left ear -->
  <polygon points="14,50 28,8 46,45" fill="#D96F28"/>
  <!-- Right ear -->
  <polygon points="86,50 72,8 54,45" fill="#D96F28"/>
  <!-- Inner left ear -->
  <polygon points="21,47 28,18 41,43" fill="#F5B48A"/>
  <!-- Inner right ear -->
  <polygon points="79,47 72,18 59,43" fill="#F5B48A"/>
  <!-- Head -->
  <circle cx="50" cy="61" r="40" fill="#E07828"/>
  <!-- Forehead highlight -->
  <ellipse cx="50" cy="46" rx="11" ry="7" fill="#F5B48A"/>
  <!-- Muzzle -->
  <ellipse cx="50" cy="74" rx="22" ry="17" fill="#FAE0C6"/>
  <!-- Left cheek -->
  <ellipse cx="28" cy="70" rx="10" ry="8" fill="#FAE0C6"/>
  <!-- Right cheek -->
  <ellipse cx="72" cy="70" rx="10" ry="8" fill="#FAE0C6"/>
  <!-- Left eye -->
  <circle cx="36" cy="56" r="5.5" fill="#1A0C06"/>
  <!-- Right eye -->
  <circle cx="64" cy="56" r="5.5" fill="#1A0C06"/>
  <!-- Eye shine left -->
  <circle cx="38" cy="54" r="2" fill="white"/>
  <!-- Eye shine right -->
  <circle cx="66" cy="54" r="2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="50" cy="68" rx="5" ry="3.5" fill="#1A0C06"/>
  <!-- Mouth -->
  <path d="M44,74 Q50,80 56,74" stroke="#1A0C06" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
